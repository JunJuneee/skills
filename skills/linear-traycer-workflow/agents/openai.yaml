interface:
  display_name: "Linear Traycer Workflow"
  short_description: "Linear 이슈를 반대 모델 계열의 3인(명세형 일반 작업은 1인) critique(위험도별 추론 수준, 야간은 Qwen·DeepSeek)·필수 테스트·Qwen PR 리뷰로 완료"
  default_prompt: "Use $linear-traycer-workflow for the Linear issues and existing PRs I specify through Traycer. Preserve each task's authorized execution contract across follow-up review requests; honor explicit review-only instructions and human holds. For new work use three opposite-family plan critics with reasoning effort set by the risk tier (high or lower for normal work; xhigh/max only for high-risk work); preserve existing in-progress contracts. Use implementation, TC, executable tests, and independent Qwen Code qwen4-max-preview PR review. On findings, actually start fixes, independent final-head checks, and re-review until clear; record pending reply routes rather than asking again for approved work. Report via the Jayzee project Slack thread, mention me with the final PR, and clean up task-owned worktrees after remote preservation. Merge only within my authorized scope."
