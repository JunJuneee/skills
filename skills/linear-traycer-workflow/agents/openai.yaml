interface:
  display_name: "Linear Traycer Workflow"
  short_description: "Linear 이슈를 사전 점검, 줄(S·M·L)별 critique, 실행 검증, 최종 리뷰로 완료. 모델은 정책 파일이 정하고 야간 중국 모델 스위치와 사용량 소진 전환을 반영"
  default_prompt: "Use $linear-traycer-workflow for the Linear issues and existing PRs I specify through Traycer. Preserve each task's authorized execution contract across follow-up review requests; honor explicit review-only instructions and human holds. For new work run the intake preflight, fix the lane (S/M/L), and take every role's harness, model and effort from scripts/resolve.py (policy.json, the night-roster switch, exhausted families) instead of choosing models by hand; preserve existing in-progress contracts. Authors and checkers use different model families. Verify by actually running tests on a clean checkout of the remote head, then run the final review loop up to the lane's round cap; hand off with needs-confirm instead of passing on round count. On findings, actually start fixes, final-head checks, and re-review; record pending reply routes rather than asking again for approved work. Report via the Jayzee project Slack thread, mention me with the final PR, and clean up task-owned worktrees after remote preservation. Merge only within my authorized scope."
